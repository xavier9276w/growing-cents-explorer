<title>Growing Cent$ Explorer</title>
<style>
/* Layout: one centred card on a quiet page. The explorer itself is encrypted below and only decrypted in the browser. */
:root { --bg: #F3F4F6; --surface: #FFFFFF; --ink: #15171C; --ink-2: #444853; --muted: #676C78; --line: #D7DAE0; --accent: #B3192F; --bad: #B3192F; --bad-wash: #FAECEE;
  --font-display: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif; --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101114; --surface: #1A1C21; --ink: #ECEDF0; --ink-2: #BEC1C9; --muted: #8F939E; --line: #30333B; --accent: #F06A78; --bad: #F06A78; --bad-wash: #391A20; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #101114; --surface: #1A1C21; --ink: #ECEDF0; --ink-2: #BEC1C9; --muted: #8F939E; --line: #30333B; --accent: #F06A78; --bad: #F06A78; --bad-wash: #391A20; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-body); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; display: grid; gap: 14px; }
.eyebrow { margin: 0; font: 600 11px/1.3 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 600 1.6rem/1.15 var(--font-display); }
h1 span { color: var(--accent); }
p { margin: 0; color: var(--ink-2); }
label { font-size: 13px; font-weight: 600; }
.pw { display: grid; gap: 6px; }
input { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 8px; border: 0; background: var(--ink); color: var(--surface); cursor: pointer; }
button[disabled] { opacity: 0.6; cursor: progress; }
.msg { font-size: 13.5px; color: var(--bad); background: var(--bad-wash); border-radius: 8px; padding: 8px 10px; }
.fine { font-size: 12px; color: var(--muted); }
</style>
</head>

<script>
(function () {
  'use strict';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var KEY = 'gc-explorer-key-' + P.salt.slice(0, 12);
  var form = document.getElementById('gate'), input = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');
  function fromB64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function toB64(buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function say(text) { msg.textContent = text; msg.hidden = false; }
  function deriveBits(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (km) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: fromB64(P.salt), iterations: P.iter, hash: 'SHA-256' }, km, 256);
    });
  }
  function decrypt(bits) {
    return crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']).then(function (key) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(P.iv) }, key, fromB64(P.ct));
    }).then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function show(html) { document.open(); document.write(html); document.close(); }

  if (!window.crypto || !crypto.subtle) {
    go.textContent = 'Open explorer';
    say('This browser cannot open the explorer. Please use a current version of Chrome, Edge, Safari or Firefox.');
    return;
  }
  go.disabled = false;
  go.textContent = 'Open explorer';
  // Re-open without asking again within the same browser tab.
  try {
    var saved = sessionStorage.getItem(KEY);
    if (saved) decrypt(fromB64(saved)).then(show).catch(function () { sessionStorage.removeItem(KEY); });
  } catch (e) { /* storage unavailable: ask for the password */ }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.hidden = true;
    go.disabled = true;
    go.textContent = 'Checking…';
    var bits;
    deriveBits(input.value).then(function (b) { bits = b; return decrypt(b); }).then(function (html) {
      try { sessionStorage.setItem(KEY, toB64(bits)); } catch (err) { /* storage unavailable */ }
      show(html);
    }).catch(function () {
      go.disabled = false;
      go.textContent = 'Open explorer';
      say('That password is not correct. Check it and try again.');
      input.select();
    });
  });
})();
</script>
